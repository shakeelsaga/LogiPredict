name: Build and Publish Multi-Arch Image

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.env.example'
      - '.gitignore'
      - 'LICENSE'
      - 'deploy.sh'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: |
          if [ ! -s VERSION ]; then
            echo "::error::VERSION file is missing or empty"
            exit 1
          fi
          echo "value=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            shakeelsaga/logipredict:latest
            shakeelsaga/logipredict:${{ github.sha }}
            shakeelsaga/logipredict:${{ steps.version.outputs.value }}
            ghcr.io/shakeelsaga/logipredict:latest
            ghcr.io/shakeelsaga/logipredict:${{ github.sha }}
            ghcr.io/shakeelsaga/logipredict:${{ steps.version.outputs.value }}

      - name: Sync Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: shakeelsaga/logipredict
          readme-filepath: ./docker_readme.md

      - name: Sync README version
        run: |
          CURRENT_VERSION="v$(tr -d '[:space:]' < VERSION)"
          sed -i "s/\*\*Current release:\*\* \`v[0-9A-Za-z.-]*\`/**Current release:** \`${CURRENT_VERSION}\`/" README.md
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: sync README version to ${CURRENT_VERSION} [skip ci]"
            git push
          fi